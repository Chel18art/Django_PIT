<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
</head>
<body style="background-color: #f0f4f8;">

    <div class="container mt-5">
        <!-- Back Button -->
        <a href="javascript:history.back()" class="btn btn-link" style="color: #4e73df;">
            <i class="fas fa-arrow-left"></i> Back
        </a>

        <h2 class="text-center mb-4" style="color: #4e73df;">Add Item</h2>

        <!-- Item Add Form -->
        <form method="POST" action="{% url 'add-item' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="name" style="color: #333;">Item Name</label>
                <input type="text" name="name" class="form-control" id="name" placeholder="Enter item name" required>
            </div>
            
            <div class="form-group">
                <label for="stock" style="color: #333;">Stock</label>
                <input type="number" name="stock" class="form-control" id="stock" placeholder="Enter item stock" required>
            </div>
            

            <div class="form-group">
                <label for="category" style="color: #333;">Category</label>
                <select name="category" class="form-control" id="category" required>
                    <option value="">Select Category</option>
                    {% for category in form.category.field.queryset %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="price" style="color: #333;">Price</label>
                <input type="number" name="price" class="form-control" id="price" placeholder="Enter item price" required>
            </div>

            <div class="form-group">
                <label for="description" style="color: #333;">Description</label>
                <textarea name="description" class="form-control" id="description" placeholder="Enter item description" required></textarea>
            </div>

            <!-- Add Item Button -->
            <button type="submit" class="btn" style="background-color: #e96842; color: white; width: 100%;">Add Item</button>
        </form>

        <!-- Error messages if any -->
        {% if messages %}
            <div class="mt-3 text-danger">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
