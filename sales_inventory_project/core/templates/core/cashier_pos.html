<h2>POS - Search Item</h2>
<form method="get">
    <input type="text" name="q" placeholder="Search item..." value="{{ query }}">
    <button type="submit">Search</button>
</form>
<ul>
    {% for item in items %}
        <li>
            {{ item.name }} - ₱{{ item.price }} (Stock: {{ item.stock }})
            <a href="{% url 'add_to_cart' item.id %}">Add to Cart</a>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'view_cart' %}">View Cart</a>
